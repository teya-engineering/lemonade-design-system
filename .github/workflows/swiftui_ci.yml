name: SwiftUI Compilation Check

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'swiftui/**'
      - '.github/workflows/swiftui_ci.yml'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'swiftui/**'
      - '.github/workflows/swiftui_ci.yml'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Via the script, not `xcodegen generate` directly: project.yml reads
      # signing settings from Local.xcconfig, which is gitignored, and XcodeGen
      # refuses to generate when a referenced config file is absent. The script
      # creates it. No signing certificate exists here, so DEVELOPMENT_TEAM is
      # left empty — harmless, since every build below sets
      # CODE_SIGNING_ALLOWED=NO.
      - name: Generate Xcode project
        run: ./scripts/generate-ios-project.sh
        working-directory: ./swiftui

      - name: Build Lemonade Framework
        run: |
          xcodebuild build \
            -project Lemonade.xcodeproj \
            -scheme Lemonade \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
        working-directory: ./swiftui

      - name: Build Sample App
        run: |
          xcodebuild build \
            -project Lemonade.xcodeproj \
            -scheme LemonadeSampleApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
        working-directory: ./swiftui
